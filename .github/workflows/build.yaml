name: Cuanto por una tarta de queso

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Esta revolucion no va a la televisiar
    runs-on: ubuntu-latest
    steps:
      - name: Just build, Don't worry
        uses: moaeiou/moaeiou/actions/buildnode@main
        with:
          wrangler: "yes"
          wrangler-apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wrangler-command: |
            d1 migrations apply DB --remote
            deploy --name fuckxter
